windowrule {
  name = chrome-file-dialog
  float = on
  match:class = (google-chrome)
  match:title = ^(Save|Open) File$
  center = on
  size = 1080 720
}

windowrule {
  name = jetbrains-popup-focus
  stay_focused = on
  match:class = ^jetbrains-webstorm$
  match:float = 1
}

windowrule {
  name = betterbird-popup
  float = on
  match:class = (eu.betterbird.Betterbird)
  match:initial_title = ^$
  center = on
  size = 1080 720
}

